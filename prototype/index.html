<!-- 数据集（元数据层，条文全文缺失时的兜底条目） -->
<script src="data/dataset-core.js"></script>
<script src="data/dataset-extra.js"></script>
<!-- 官方全文索引（条文正文来源，规范见 docs/06-全文数据规范.md） -->
<script src="data/fulltext/manifest.js"></script>
