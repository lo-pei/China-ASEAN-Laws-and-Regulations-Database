<!-- 数据集（元数据层，条文全文缺失时的兜底条目） -->
  <!-- 数据源决定：file:// 打开时加载完整 catalog 与预计算 IDF（离线兜底）；
       http(s) 打开说明后端在托管静态站，改用 /api/bootstrap（2.7 KB）+
       /api/laws/compact 后台补齐，首屏不必解析 15.9 MB 的 intl-catalog.js
       与 3.7 MB 的 bm25-idf.js。API 模式下若后端不可用，前端会自动现算 IDF 兜底。 -->
  <script>
  (function () {
    var proto = location.protocol, host = location.host;
    var isHttp = (proto === 'http:' || proto === 'https:') && !!host;
    window.__CALR_API_MODE = isHttp ? (proto + '//' + host) : null;
    if (!isHttp) {
      document.write('<script src="data/intl-catalog.js"><\/script>');
      document.write('<script src="data/bm25-idf.js"><\/script>');
    } else if (window.console) {
      console.info('[CALR] API 模式：跳过 intl-catalog.js（15.9 MB）与 bm25-idf.js（3.7 MB），' +
                   '改用 /api/bootstrap + /api/laws/compact');
    }
  })();
  </script>
<script src="data/dataset-core.js"></script>

<!-- 官方全文索引（条文正文来源，规范见 docs/06-全文数据规范.md） -->

<!-- 译文层索引：大模型翻译文本与官方原文分离存放 -->
  <!-- 译文层索引：两种模式都要加载。
       它只是「1,566 部法规 → 分卷」的映射表（135 KB，gzip 后约 20 KB），不含正文；
       不加载它，API 模式下 transPackFor() 永远返回 null，所有译文都取不到，
       表现就是「切到英文后译文位置是空的」。译文分卷本身仍按需加载。 -->
  <script src="data/trans/manifest.js"></script>
<!-- 界面多语种译文表（缺失时自动回退中文原文） -->
<!-- 界面语言包按需加载：默认中文一个都不需要（5 个合计 552 KB）。
     各语言包定义独立全局变量 CALR_I18N_EN / _VI / _TH / _ID / _MS，
     注入后由 CALR_I18N_MERGE(code) 合并进 CALR_I18N 并重新渲染。 -->
<script>
(function (root) {
  var FILES = { en: 'data/i18n-en.js', vi: 'data/i18n-vi.js', th: 'data/i18n-th.js',
                id: 'data/i18n-id.js', ms: 'data/i18n-ms.js' };
  var asked = {};
  root.__CALR_ENSURE_LANG = function (code) {
    var f = FILES[code];
    if (!f || asked[code]) return;
    asked[code] = true;
    var s = document.createElement('script');
    s.src = f;
    s.onload = function () {
      if (root.CALR_I18N_MERGE) root.CALR_I18N_MERGE(code);
      /* 语言包到位后重新渲染当前页面 */
      if (root.CALR && CALR.i18n && CALR.i18n.setLang) {
        try { CALR.i18n.setLang(code); } catch (e) { /* 忽略 */ }
      }
    };
    s.onerror = function () { asked[code] = false; };
    document.head.appendChild(s);
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
