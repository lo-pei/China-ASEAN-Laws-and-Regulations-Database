services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: calr-api:phaseA
    container_name: calr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 只读挂载数据库（由 python backend/build_db.py 生成）
      - ./backend/data:/app/backend/data:ro
    environment:
      - CALR_DB=/app/backend/data/calr.db
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 1.5GB 数据库 + BM25 计算，给足内存
    deploy:
      resources:
        limits:
          memory: 2G
